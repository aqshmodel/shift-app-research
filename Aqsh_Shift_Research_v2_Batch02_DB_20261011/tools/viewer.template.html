<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aqsh シフト競合調査 __BATCH_LABEL__</title>
<style>:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#183148;background:#f2f6f9}body{margin:0}header{background:#152c43;color:white;padding:30px max(20px,5vw)}h1{font-size:24px;margin:0 0 10px}p{line-height:1.7}main{max-width:1450px;margin:24px auto;padding:0 20px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;position:sticky;top:0;background:#f2f6f9;padding:14px 0;z-index:2}input,select,button{font:inherit;padding:9px;border:1px solid #b9cbd7;border-radius:6px}input[type=search]{min-width:290px;flex:1}button{background:white;cursor:pointer;color:#17435c}button.primary{background:#087f8c;color:white}button:focus-visible,a:focus-visible{outline:3px solid #d38619}button:hover{filter:brightness(.96)}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:15px}.card,section{background:white;border:1px solid #d4e0e8;border-radius:9px;padding:18px}.card h2{font-size:18px;margin:6px 0 9px}.muted{font-size:13px;color:#566c7e}.tag{font-size:12px;padding:4px 8px;border-radius:4px;background:#e8f4f4;display:inline-block}.card label{display:flex;align-items:center;gap:8px;margin-top:15px}a{color:#067284;overflow-wrap:anywhere}h2{font-size:20px}h3{font-size:16px}.scroll{overflow:auto;max-height:80vh}table{width:100%;border-collapse:collapse;min-width:700px;background:white}th,td{border:1px solid #d6e1e8;padding:12px;vertical-align:top;line-height:1.6;font-size:14px;text-align:left;min-width:180px}th{background:#eaf4f6;position:sticky;top:0}td:first-child,th:first-child{min-width:130px;max-width:180px}.note{background:#fff1d5;padding:14px;border-radius:7px}.rec{border-top:1px solid #d8e3ea;padding:12px 0;overflow-wrap:anywhere}.rec p{margin:6px 0}.hidden{display:none!important}.source{font-size:12px}#detail,#comparison{margin:20px 0}.controls{display:flex;justify-content:space-between;gap:12px;align-items:center}footer{padding:35px;text-align:center;color:#566c7e}input[type=checkbox]{width:18px;height:18px}.brand{height:48px;display:flex;align-items:center;justify-content:flex-start;padding:8px;margin:10px 0;background:#f1f5f8;border-radius:6px}.brand.dark{background:#203f47}.brand img{max-width:220px;max-height:44px;object-fit:contain}.brand-label{font-size:11px;color:#566c7e}</style>
<header><h1>AQSH｜シフト自動作成サービス 競合調査</h1><div>__BATCH_LABEL__ 累積版・__AS_OF_LABEL__｜50提供単位・__DOCUMENT_COUNT__文書観測・独立性能試験0件</div><p>製品を検索し、詳細から根拠を追えます。比較用チェックは最大4件。未確認を非対応とは扱いません。</p></header>
<main><p class="note">公開資料の記載を確認した調査です。全設問の確認・見積取得・デモ・性能試験は未実施。料金は地域・機能・人数・契約期間を合わせて解釈してください。</p>
<div class="toolbar"><input type="search" id="search" placeholder="製品名・機能・本文で検索" aria-label="検索"><select id="region" aria-label="地域"><option value="">全地域</option><option value="JP">国内</option><option value="US">海外</option></select><label><input id="newonly" type="checkbox">今回追加調査のみ</label><button id="compare" class="primary">選択を比較（0/4）</button><button id="clear">選択解除</button></div>
<p><button id="showrules">制度の参考算式・条件</button></p><section id="rules" class="hidden"></section><div id="message" role="status" class="muted"></div><section id="comparison" class="hidden"></section><section id="detail" class="hidden"></section><div class="cards" id="cards"></div></main><footer>SQLiteと同じ記録に基づくローカル閲覧用。外部へ入力内容を送信しません。出典リンクは別タブで開きます。</footer>
<script id="dataset" type="application/json">__DATASET__</script>
<script>
'use strict';const data=JSON.parse(document.getElementById('dataset').textContent);const selected=new Set();
const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const url=u=>{try{return new URL(u).protocol==='https:'?u:'#'}catch{return '#'}};
const link=(u,t='出典を確認')=>`<a href="${esc(url(u))}" target="_blank" rel="noopener noreferrer">${esc(t)}</a>`;
const state=x=>({known:'記載確認',not_researched:'未調査',not_found:'確認範囲で未確認',not_disclosed:'非公開',inaccessible:'取得不可',disputed:'情報矛盾'}[x]||x);
const support=x=>({supported:'対応記載',limited:'部分確認',unsupported:'非対応記載',planned:'提供予定',unknown:'仕様未確定',not_applicable:'対象外'}[x]||x);
const role=x=>({accepted:'採用根拠',conflicting:'矛盾根拠',context:'参考記録',historical_only:'過去の記録',rejected:'分類訂正で採用対象外'}[x]||x);
const decision=x=>({accepted:'資料採用',unresolved:'未確定',outdated:'過去の判断',not_applicable:'対象外'}[x]||x);
const tax=x=>({inclusive:'税込',exclusive:'税別',unknown:'税区分未確認',not_applicable:'税区分対象外'}[x]||x);
const amount=x=>({known:'掲載額確認',unknown:'金額未確認',quote_required:'要見積',disputed:'金額矛盾'}[x]||x);
const unit=x=>x==='employee_month_equivalent'?'1人・月相当':x==='account_month'?'アカウント':x;
const period=x=>x.recurrence_months===12?'年額（12か月）':x.recurrence_months===1?'月額':x.recurrence_months?`${x.recurrence_months}か月ごと`:'単発・周期未確認';
const logoSrc=u=>{if(/^data:image\/svg\+xml;base64,[A-Za-z0-9+/=]+$/.test(u||''))return u;try{return ['http:','https:'].includes(new URL(u).protocol)?u:''}catch{return ''}};
const logo=p=>p.logo_url?`<div class="brand ${['JP12','JP13','JP14','US08'].includes(p.product_id)?'dark':''}"><img src="${esc(logoSrc(p.logo_url))}" alt="${esc(p.brand_name)} ロゴ" loading="lazy" referrerpolicy="no-referrer" data-logo></div><div class="brand-label">${p.logo_kind==='company'?'会社ロゴ':'サービスロゴ'}</div>`:'';
const added=p=>p.latest_batch_count>0;
function showRules(){const rules=data.regulations||[];$('rules').classList.remove('hidden');$('rules').innerHTML=`<div class="controls"><h2>制度の参照情報 ${rules.length}件</h2><button data-close="rules">閉じる</button></div><p class="note">行政資料と専門団体の手引きを区別して保存しています。各製品による実装・計算結果の確認とは別です。届出区分・施設条件・正式通知との照合が必要です。</p>${rules.map(r=>{const a=JSON.parse(r.applicability_json);return `<div class="rec"><h3>${esc(r.title)}</h3><span class="tag">${r.authority_type==='professional_guideline'?'専門団体の手引き':'行政の制度資料'} / ${esc(r.version_label)}</span><p>${esc(a.summary_ja)}</p>${a.formula?`<p>参考式：${esc(a.formula)}</p>`:''}<p class="muted">${esc(a.limitations)} · 適用開始日 ${esc(r.effective_from||'未確定')}</p><div class="source">${link(r.retrieval_url,r.title_at_retrieval)} · ${esc(a.locator)} · 取得 ${esc(r.retrieved_on)}<br>${esc(r.regulation_id)}</div></div>`}).join('')}`;$('rules').scrollIntoView({behavior:'smooth',block:'start'})}
$('showrules').hidden=!(data.regulations||[]).length;$('showrules').addEventListener('click',showRules);
function render(){const q=$('search').value.trim().toLowerCase(),reg=$('region').value;let list=data.products.filter(p=>(!reg||p.market_region===(reg==='JP'?'domestic':'overseas'))&&(!$('newonly').checked||added(p)));if(q)list=list.filter(p=>(p.canonical_name+' '+p.product_kind+' '+data.observations.filter(o=>o.offering_id===p.offering_id).map(o=>(o.summary_ja||o.unknown_reason||'')).join(' ')).toLowerCase().includes(q));$('cards').innerHTML=list.map(p=>`<article class="card"><span class="tag">${esc(p.product_id)} / ${p.market_region==='domestic'?'国内':'海外'}${added(p)?' / 今回追加調査':''}</span>${logo(p)}<h2>${esc(p.canonical_name)}</h2><p class="muted">${esc(p.product_kind)}<br>共通項目の資料採用 ${p.documented_common_scopes}/40（部分確認を含む。品質点数ではない）</p><button data-detail="${esc(p.offering_id)}">出典付きの詳細</button><label><input type="checkbox" data-pick="${esc(p.offering_id)}" ${selected.has(p.offering_id)?'checked':''}>比較する</label></article>`).join('');$('message').textContent=`表示 ${list.length} / ${data.products.length} 件`;$('compare').textContent=`選択を比較（${selected.size}/4）`}
function showDetail(id){const p=data.products.find(x=>x.offering_id===id),obs=data.observations.filter(x=>x.offering_id===id),pr=data.prices.filter(x=>x.offering_id===id);$('detail').classList.remove('hidden');$('detail').innerHTML=`<div class="controls"><h2>${esc(p.canonical_name)} / ${esc(id)}</h2><button data-close="detail">閉じる</button></div>${logo(p)}<p class="muted">${link(p.logo_source_page,'ロゴ掲載元')} · ${esc(p.logo_notes||'')}</p><p>${link(p.official_url,'代表資料')}　法人表記：${esc(p.legal_name||'未確定')}</p><p class="muted">歴史的記録も表示しています。「過去の記録」は最新の採用判断から外れた記録です。「参考記録」は留保や以前の根拠を示します。</p><h3>料金・条件</h3>${pr.length?pr.map(x=>{const a=JSON.parse(x.conditions_json||'{}');return `<div class="rec"><b>${esc(x.plan_name)}</b> <span class="muted">${x.current_evidence_role==='accepted'?'最新の採用根拠':'料金履歴・現行性は要確認'} · ${esc(x.price_checked_on||'取得日未確認')}</span><p>${esc(x.unit_amount_decimal??a.raw_display_amount??'未確定')} ${esc(x.currency||'通貨未確定')} / ${esc(unit(x.billable_unit))}（${esc(tax(x.tax_status))}・${esc(amount(x.amount_status))}・${esc(period(x))}）</p><p>${esc(a.notes||'')}</p><div class="source">${link(x.canonical_url||p.official_url)}</div></div>`}).join(''):'<p>構造化された料金記録は未登録。0円や非公開とは判断しません。</p>'}<h3>文書観測 ${obs.length}件</h3>${obs.map(o=>`<div class="rec"><span class="tag">${esc(o.criterion_id)} ${esc(o.label_ja)}</span> <span class="muted">${esc(state(o.value_state))} / ${esc(support(o.support_status))} / ${esc(role(o.current_evidence_role))}</span><p>${esc(o.summary_ja||o.unknown_reason)}</p><p class="muted">${esc(o.limitations)}</p><div class="source">${(o.evidence||[]).map(e=>link(e.canonical_url,e.title)+' · '+esc(e.locator)+' · 取得 '+esc(e.retrieved_on)).join('<br>')}<br>${esc(o.observation_id)}</div></div>`).join('')}`;$('detail').scrollIntoView({behavior:'smooth',block:'start'})}
function compare(){if(selected.size<2){$('message').textContent='比較する提供単位を2〜4件選択してください。';return}const ids=[...selected],ps=ids.map(id=>data.products.find(x=>x.offering_id===id));$('comparison').classList.remove('hidden');$('comparison').innerHTML=`<div class="controls"><h2>共通40項目で比較</h2><button data-close="comparison">閉じる</button></div><p class="muted">資料の記述を並べています。同じ名称でもプラン・対象範囲が異なります。詳細画面で留保と原資料を確認してください。</p><div class="scroll"><table><thead><tr><th>設問</th>${ps.map(p=>`<th>${esc(p.canonical_name)}</th>`).join('')}</tr></thead><tbody>${data.criteria.map(q=>`<tr><td>${esc(q.criterion_id)}<br>${esc(q.label_ja)}</td>${ids.map(id=>{const x=data.common.find(x=>x.offering_id===id&&x.criterion_id===q.criterion_id);return `<td>${esc(x?.finding||'未調査')}<p class="muted">${esc(decision(x?.decision||'unresolved'))}<br>${esc(x?.rationale||'')}</p></td>`}).join('')}</tr>`).join('')}</tbody></table></div>`;$('comparison').scrollIntoView({behavior:'smooth'})}
document.addEventListener('error',e=>{if(e.target.matches?.('[data-logo]'))e.target.hidden=true},true);
document.addEventListener('click',e=>{const d=e.target.closest('[data-detail]');if(d)showDetail(d.dataset.detail);const c=e.target.closest('[data-close]');if(c)$(c.dataset.close).classList.add('hidden')});document.addEventListener('change',e=>{if(e.target.dataset.pick){const id=e.target.dataset.pick;if(e.target.checked){if(selected.size>=4){e.target.checked=false;$('message').textContent='比較は最大4件です。';return}selected.add(id)}else selected.delete(id);render()}});$('search').addEventListener('input',render);$('region').addEventListener('change',render);$('newonly').addEventListener('change',render);$('compare').addEventListener('click',compare);$('clear').addEventListener('click',()=>{selected.clear();render()});render();
</script></html>
